# BoBo/dsh/patch/web-acquisition.yml
# 把采集工具插件 `@deepseek-ai/dsh-tool-acquisition`（crawl_fetch）注入 Web 装配。
#
# 用法：与端口补丁一起叠加 ——
#   pnpm bobo   （bobo 脚本内部已同时加载 packages/bobo/cordis.patch.yml 与本文件）
#
# 可移植性说明（不写死任何机器路径）：
# - `name` 用裸包名 `@deepseek-ai/dsh-tool-acquisition`：该包已声明在 apps/cli 的
#   dependencies 里，启动时由 dsh 的 healProfilesModuleFallback 自动 link 到
#   ~/.dsh/profiles/node_modules，因此任意机器 / 任意平台（Windows/Linux/macOS）
#   都能解析，不再依赖 file:// 绝对路径。
# - `config` 里 pythonBin / scriptsDir **留空**：由插件按自身位置自动定位 BoBo
#   项目根的 `.venv` 与 `scripts`（跨机器、跨平台可移植，无需环境变量、不依赖
#   启动时的 cwd）。`dataDir` 留空时，采集结果优先存到**当前会话工作区**下的
#   `data/`（没有会自动创建），仅在会话无工作区时回退到 BoBo 根 `data`。
#
# 语法要点（与官方 examples/web-cordis/cordis.yml 一致）：
# - 新增插件行必须用 `- insert:`；裸的 `- id:` 只会覆盖已存在的行，
#   若 id 不存在会被静默跳过，工具不会加载。
# - `- id: webserver` 那类是“覆盖已有行”的写法，只适用于端口补丁这种改配置场景。
#
- insert:
    - id: tool-acquisition
      name: '@deepseek-ai/dsh-tool-acquisition'
      config:
        # pythonBin / scriptsDir 留空，由插件按自身位置自动定位 BoBo 根的
        # .venv 与 scripts（跨机器、跨平台可移植，无需环境变量）。
        dataDir: ''
        timeoutMs: 120000

    # 本地 Camoufox 搜索 provider（web_search）：替换 DeepSeek 云搜索。
    # engine 默认 baidu（国内直连、返回真实 URL）；可选 bing（有反爬投毒问题，不推荐）。
    - id: web-search-camoufox
      name: '@deepseek-ai/dsh-web-search-camoufox'
      config:
        engine: baidu
        timeoutMs: 90000

# 把 web 搜索从 deepseek-official 切到 camoufox，实现“彻底的本地化搜索替换”。
# 注意：overlay 会整体替换该插件行的 config，故此处必须把需要的字段写全。
- id: web
  config:
    searchProvider: camoufox
