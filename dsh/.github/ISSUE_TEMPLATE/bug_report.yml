name: 🐞 Bug 报告
description: 报告 DeepSeek Harness 桌面端的问题
labels: [pending triage]
title: 'BUG | `功能名称` | '
body:
  - type: markdown
    attributes:
      value: |
        感谢你抽出时间填写这份 Bug 报告！

        请遵循以下标题格式：``BUG | `功能名称` | 简短描述``
        例如：``BUG | `运行日志` | 日志窗口内容不刷新``
  - type: textarea
    id: bug-description
    attributes:
      label: 描述 Bug
      description: 清晰、简洁地描述 Bug 是什么。如果你打算为这个问题提交 PR，请在描述中告诉我们，谢谢。
      placeholder: Bug 描述
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供能够复现该问题的最小步骤（或一个[最小可复现示例](https://stackoverflow.com/help/minimal-reproducible-example)的链接）。
      placeholder: |
        1. 打开应用
        2. 点击……
        3. 出现错误
    validations:
      required: true
  - type: textarea
    id: run-log
    attributes:
      label: 运行日志
      description: 请点击窗口 **左上角 → 帮助 → 运行日志**，点击「复制」按钮后，把完整的日志内容粘贴到下面。
      render: text
      placeholder: （在此粘贴运行日志）
    validations:
      required: true
  - type: checkboxes
    id: checkboxes
    attributes:
      label: 检查清单
      description: 提交之前，请确认你已完成以下事项
      options:
        - label: 阅读了项目的 [README](https://github.com/dsh-tauri/deepseek-harness-desktop)
          required: true
        - label: 检查[已有 issues](https://github.com/dsh-tauri/deepseek-harness-desktop/issues) 中没有相同问题的报告，避免重复提交
          required: true
        - label: 确认这是具体、可复现的 Bug，而不是使用咨询
          required: true
        - label: 提供了[最小可复现示例](https://stackoverflow.com/help/minimal-reproducible-example)以及完整的运行日志
          required: true
