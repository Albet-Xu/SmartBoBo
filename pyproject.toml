# BoBo 智能采集平台 · Python 环境（由 uv 管理）
#
# - 虚拟环境统一放在项目根的 `.venv/`（uv 标准位置），用下面的命令创建/同步：
#     uv sync
# - Python 版本与依赖版本全部锁定在 `uv.lock`（应提交到版本库）。
# - 采集引擎以“本地路径依赖”引入（改源码即生效，等同 editable 安装）。

[project]
name = "bobo"
version = "0.1.0"
description = "BoBo 智能采集平台：本地 Python 采集引擎环境（camoufox 单引擎）"
# 「环境容器」项目的 requires-python 选宽松值；实际解释器由 uv 与环境内依赖约束决定
requires-python = ">=3.10"
dependencies = [
    # 采集引擎 —— 唯一引擎：Camoufox 抗检测浏览器（浏览器功能只走 camoufox）
    "camoufox>=0.5.5",
    # HTML 转 Markdown 工具
    "html2text>=2024.2.26",
    # 网页块级骨架生成（skeleton 输出格式）——沿用项目根 aaa.py 的解析栈 lxml
    "lxml>=5.3.0",
    # 工作流模式 —— 提取入库脚本的数据库驱动（db-extraction 技能/dbx_connector 使用）
    # MySQL / MariaDB
    "pymysql>=1.1.0",
    # PostgreSQL
    "psycopg[binary]>=3.2.0",
    "mcp>=1.2,<2",
    # 逆向经验沉淀（RAG 记忆增强）—— 向量化 + Qdrant 客户端
    "fastembed>=0.4",
    "qdrant-client>=1.9",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# 本项目只是“Python 环境容器”，本身不构建/分发任何 Python 包，
# 标记为非 package（virtual project），只安装其依赖、不安装本包自身。
package = false
# 版本覆盖：camoufox 要求 playwright<1.61（其运行时依赖的协议版本约束），
# 以 override 固定已验证可用的组合。
override-dependencies = [
    "playwright<1.61",
]
# 虚拟环境目录（uv 默认即 .venv，此处仅作说明）
# venv = ".venv"
# 固定解释器版本：见项目根的 `.python-version` 文件（`uv python pin 3.13` 生成）。
# 也可用 `[tool.uv] python-preference` 控制解释器来源偏好。
