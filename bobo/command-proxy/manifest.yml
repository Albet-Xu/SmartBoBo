# 代理命令工具的市场清单（scripts/build_market.py 读取；check 会校验本文件）。
# publish: false —— 内置工具不进市场目录（用户已拍板）。
id: bobo-proxy-tool          # 规范名（与 package.json name 一致）
dir: command-proxy           # 包目录名 = 安装目录名
name: 代理命令
description: /proxy 斜杠命令开关会话代理模式；mount 行抄自 presets/crawl/agent.cordis.yml（namespace/projection 由 host 层注册，这里必须关掉）。
version: 1.0.0
publish: false               # 内置工具不进市场目录（用户已拍板）
builtin: true
minAppVersion: 2.1.1
mount:                       # 挂载行模板；name 中 @@APP@@ 占位符 = 应用 packages/bobo 绝对路径（阶段C安装器替换）
  - id: command-proxy
    name: "@@APP@@/command-proxy/lib/index.js"
    config:
      namespace: false
      projection: false
defaultScope: all
