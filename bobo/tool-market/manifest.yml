# 技能市场工具的市场清单（scripts/build_market.py 读取；check 会校验本文件）。
# publish: false —— 内置工具不进市场目录（用户已拍板）。
id: bobo-market-tool          # 规范名（与 package.json name 一致）
dir: tool-market              # 包目录名 = 安装目录名
name: 技能市场工具
description: 模型侧技能市场四件套——market_search 搜索、market_detail 精读能力披露、market_file 读包内文件、market_install 校验 frontmatter 后安装到技能库（不提供删除/卸载）。
version: 1.0.0
publish: false               # 内置工具不进市场目录（用户已拍板）
builtin: true
minAppVersion: 2.1.1
mount:                       # 挂载行模板；name 中 @@APP@@ 占位符 = 应用 packages/bobo 绝对路径（阶段C安装器替换）
  - id: tool-market
    name: "@@APP@@/tool-market/lib/index.js"
defaultScope: all
